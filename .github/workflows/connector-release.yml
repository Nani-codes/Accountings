name: Connector Release

# Builds the Windows Tally connector .exe and attaches it to a GitHub Release.
# Trigger by pushing a tag like: connector-v0.1.0
#   git tag connector-v0.1.0 && git push origin connector-v0.1.0
#
# The published asset is reachable at a stable "latest" URL:
#   https://github.com/<owner>/<repo>/releases/latest/download/AccountingsConnector.exe
# Point TALLY_CONNECTOR_DOWNLOAD_URL at that so the app's download button works.

on:
  push:
    tags:
      - "connector-v*"
  # Allow manual runs for testing the build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/tally-connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install connector + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build single-file exe
        run: pyinstaller build.spec

      - name: Smoke test the exe
        env:
          # Belt-and-suspenders: force UTF-8 so console output can't crash on
          # the runner's default cp1252 code page.
          PYTHONUTF8: "1"
        run: |
          .\dist\AccountingsConnector.exe --version
          .\dist\AccountingsConnector.exe --help

      # --- Code signing (optional) -------------------------------------------
      # To sign, add repo secrets SIGN_CERT_PFX_BASE64 and SIGN_CERT_PASSWORD,
      # then uncomment this step. Unsigned exes trigger Windows SmartScreen.
      # - name: Sign exe
      #   if: ${{ secrets.SIGN_CERT_PFX_BASE64 != '' }}
      #   shell: pwsh
      #   run: |
      #     $pfx = [System.Convert]::FromBase64String("${{ secrets.SIGN_CERT_PFX_BASE64 }}")
      #     Set-Content -Path cert.pfx -Value $pfx -AsByteStream
      #     & "C:/Program Files (x86)/Windows Kits/10/bin/x64/signtool.exe" sign `
      #       /f cert.pfx /p "${{ secrets.SIGN_CERT_PASSWORD }}" `
      #       /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
      #       dist/AccountingsConnector.exe

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: AccountingsConnector
          path: apps/tally-connector/dist/AccountingsConnector.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (tagged runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/tally-connector/dist/AccountingsConnector.exe
          generate_release_notes: true
