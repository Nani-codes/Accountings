[project]
name = "gst-workbench-api"
version = "0.1.0"
description = "AI GST Reconciliation Workbench API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "agno[os,google]>=2.0.0",
  "google-genai>=1.0.0",
  "google-auth>=2.0.0",
  "reportlab>=4.2.0",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
  "bcrypt>=5.0.0",
  "ddgs>=9.16.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
